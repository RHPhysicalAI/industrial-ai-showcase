apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-data
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
  # Uses the cluster default StorageClass; overlays can select another class.
