apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: hub-acm
  namespace: openshift-gitops
spec:
  generators:
    - git:
        repoURL: https://github.com/rhkp/industrial-ai-showcase.git
        revision: main
        directories:
          # Hosted Companion registration only. The older policy, compliance,
          # and self-managed infrastructure apps remain available in Git but
          # are not selected for the hosted demo SNO.
          - path: infrastructure/gitops/apps/hub-acm/clusterset
          - path: infrastructure/gitops/apps/hub-acm/managedcluster
          - path: infrastructure/gitops/apps/hub-acm/gitops-integration
          - path: infrastructure/gitops/apps/hub-acm/appset-companion
  template:
    metadata:
      name: 'hub-acm-{{path.basename}}'
      labels:
        phase: phase-0
        layer: hub-acm
      annotations:
        argocd.argoproj.io/compare-options: ServerSideDiff=true
    spec:
      project: default
      source:
        repoURL: https://github.com/rhkp/industrial-ai-showcase.git
        targetRevision: main
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: openshift-gitops
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
