apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - vault-connection.yaml
  - vault-auth.yaml
  - vault-static-secret.yaml
  - vault-rhoai-apps-s3.yaml
  - cnpg-cluster.yaml
  - ../../../components/seaweedfs
  - bucket-init-job.yaml
  - mlflow.yaml
patches:
  # Do not set a global namespace: this app also projects Vault secrets into
  # redhat-ods-applications for the operator-managed MLflow server.
  - target:
      name: seaweedfs.*
    patch: |-
      - op: add
        path: /metadata/namespace
        value: mlflow
  - target:
      kind: Deployment
      name: seaweedfs
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/envFrom/0/secretRef/name
        value: mlflow-s3-credentials
  - target:
      kind: PersistentVolumeClaim
      name: seaweedfs-data
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 200Gi
