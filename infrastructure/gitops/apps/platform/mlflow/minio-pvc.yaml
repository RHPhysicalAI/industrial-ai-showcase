apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: mlflow
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Training retains staging data, checkpoints, native GR00T weights, and
      # the secondary ONNX export during a run; 120Gi reached MinIO's free-
      # space threshold before checkpoint upload completed.
      storage: 200Gi
  storageClassName: gp3
