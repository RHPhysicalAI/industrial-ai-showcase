apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: vault
  namespace: vla-training
spec:
  address: http://vault.vault.svc.cluster.local:8200
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault
  namespace: vla-training
spec:
  vaultConnectionRef: vault
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: vso-read
    serviceAccount: default
---
# SeaweedFS credentials for DSPA object storage and pipeline steps
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: s3-credentials
  namespace: vla-training
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  vaultAuthRef: vault
  type: kv-v2
  mount: kv
  path: mlflow/s3
  destination:
    name: s3-credentials
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
      templates:
        AWS_ACCESS_KEY_ID:
          text: '{{ get .Secrets "AWS_ACCESS_KEY_ID" }}'
        AWS_SECRET_ACCESS_KEY:
          text: '{{ get .Secrets "AWS_SECRET_ACCESS_KEY" }}'
  refreshAfter: 1h
---
# Git credentials for BuildConfig source cloning
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: git-source-secret
  namespace: vla-training
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  vaultAuthRef: vault
  type: kv-v2
  mount: kv
  path: argocd/repo-creds
  destination:
    name: git-source-secret
    create: true
    overwrite: true
    type: kubernetes.io/basic-auth
    transformation:
      excludeRaw: true
      templates:
        username:
          text: git
        password:
          text: '{{ get .Secrets "token" }}'
  refreshAfter: 1h
---
# HuggingFace token for gated model downloads
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: hf-credentials
  namespace: vla-training
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  vaultAuthRef: vault
  type: kv-v2
  mount: kv
  path: hf/token
  destination:
    name: hf-credentials
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
      templates:
        HF_TOKEN:
          text: '{{ get .Secrets "token" }}'
  refreshAfter: 1h
