# Demo-lab profile for the single-node RWO Nucleus topology.
#
# The Hub worker hosting nucleus-api is shared with other demo workloads and
# has 7.5 vCPU allocatable. Keep limits unchanged; lower requests reflect the
# observed idle footprint and allow all Nucleus services to co-locate on the
# same node as required by nucleus-data (ReadWriteOnce).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nucleus-api
  namespace: omniverse-nucleus
spec:
  template:
    spec:
      containers:
        - name: nucleus-api
          resources:
            requests:
              cpu: 250m
---
apiVersion: apps/v1
