apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: loki-s3
  namespace: openshift-logging
spec:
  vaultAuthRef: vault
  type: kv-v2
  mount: kv
  path: loki/s3
  destination:
    name: loki-s3
    create: true
    overwrite: true
    transformation:
      # Keep existing bucket/key values; always project the current endpoint.
      templates:
        endpoint:
          text: http://seaweedfs.obs-storage.svc.cluster.local:8333
  refreshAfter: 1h
