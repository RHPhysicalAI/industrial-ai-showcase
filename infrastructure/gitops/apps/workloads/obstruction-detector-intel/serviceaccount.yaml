# This project was developed with assistance from AI tools.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: obstruction-detector-intel
  namespace: intel-vla-training
  labels:
    app: obstruction-detector-intel
    variant: intel
---
# Used by the YOLOv8 predictor so KServe's storage-initializer can pull the
# model from S3/MinIO. Previously existed only in-cluster.
#
# The S3 endpoint and TLS settings live as annotations on the referenced
# Secret, NOT here and NOT on the InferenceService -- KServe's pod mutator
# only reads them off the Secret. The live SA carried stale annotations
# pointing at a different MinIO backend, which were inert but misleading;
# they are deliberately omitted here.
#
# minio-s3-secret holds credentials and is therefore not in git. Create it
# out-of-band before first sync -- see README.md in this directory.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: yolov8-sa
  namespace: intel-vla-training
  labels:
    app: yolov8-detector
    variant: intel
secrets:
- name: minio-s3-secret