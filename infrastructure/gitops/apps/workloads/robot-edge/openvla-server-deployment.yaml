apiVersion: apps/v1
kind: Deployment
metadata:
  name: openvla-server
  namespace: robot-edge
  labels:
    app: openvla-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openvla-server
  template:
    metadata:
      labels:
        app: openvla-server
    spec:
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-L40S
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      containers:
      - name: openvla-server
        image: image-registry.openshift-image-registry.svc:5000/robot-edge/openvla-server:latest
        imagePullPolicy: Always
        env:
        - name: VLA_MODE
          value: "openvla"
        - name: SERVICE_NAME
          value: "openvla-server"
        - name: LOG_LEVEL
          value: "INFO"
        - name: PORT
          value: "8000"
        - name: OPENVLA_WEIGHTS
          valueFrom:
            configMapKeyRef:
              name: policy-version
              key: model-uri
        - name: S3_ENDPOINT
          value: "http://minio.mlflow.svc:9000"
        - name: MODEL_CACHE_DIR
          value: "/models"
        - name: HF_HOME
          value: "/tmp/hf_cache"
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: storage-config
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: storage-config
              key: AWS_SECRET_ACCESS_KEY
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        resources:
          requests:
            cpu: "2"
            memory: "8Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "4"
            memory: "16Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: model-cache
          mountPath: /models
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: model-cache
        persistentVolumeClaim:
          claimName: model-cache
