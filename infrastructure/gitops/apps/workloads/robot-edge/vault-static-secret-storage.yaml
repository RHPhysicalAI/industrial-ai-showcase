apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: storage-config
  namespace: robot-edge
spec:
  vaultAuthRef: vault
  type: kv-v2
  mount: kv
  path: mlflow/s3
  destination:
    name: storage-config
    create: true
    overwrite: true
  refreshAfter: 1h
