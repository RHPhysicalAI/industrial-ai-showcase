apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: coturn-credentials
  namespace: fleet-ops
spec:
  vaultAuthRef: vault
  type: kv-v2
  mount: kv
  path: coturn/credentials
  destination:
    name: coturn-credentials
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
      templates:
        password:
          text: '{{ get .Secrets "password" }}'
  refreshAfter: 1h