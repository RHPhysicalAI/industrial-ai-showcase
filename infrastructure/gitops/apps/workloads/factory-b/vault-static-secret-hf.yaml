apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: hf-token
  namespace: factory-b
spec:
  vaultAuthRef: vault
  type: kv-v2
  mount: kv
  path: hf/token
  destination:
    name: hf-token
    create: true
    overwrite: true
  refreshAfter: 1h
