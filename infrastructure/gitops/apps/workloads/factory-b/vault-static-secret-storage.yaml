# This project was developed with assistance from AI tools.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: storage-config
  namespace: factory-b
spec:
  vaultAuthRef: vault
  type: kv-v2
  mount: kv
  path: mlflow/s3
  destination:
    name: storage-config
    create: true
    overwrite: true
    annotations:
      serving.kserve.io/s3-endpoint: seaweedfs.mlflow.svc.cluster.local:8333
      serving.kserve.io/s3-usehttps: "0"
      serving.kserve.io/s3-region: us-east-1
      serving.kserve.io/s3-usevirtualbucket: "false"
  refreshAfter: 1h
