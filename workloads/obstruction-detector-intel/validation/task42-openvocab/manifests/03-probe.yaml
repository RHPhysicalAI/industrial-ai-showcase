apiVersion: v1
kind: Pod
metadata:
  name: ov-probe
  namespace: intel-vla-training
spec:
  restartPolicy: Never
  containers:
  - name: probe
    image: registry.access.redhat.com/ubi9/python-311:latest
    command: ["sleep", "infinity"]
    workingDir: /work
    volumeMounts:
    - {name: work, mountPath: /work}
    resources:
      requests: {cpu: 500m, memory: 1Gi}
      limits:   {cpu: "2",  memory: 4Gi}
  volumes:
  - name: work
    emptyDir: {}
