apiVersion: v1
kind: Namespace
metadata:
  name: intel-vla-training
  labels:
    variant: intel
---
# One PVC per model, deliberately. Cluster has EBS-only storage classes
# (gp2/gp3, RWO) -- a single shared PVC would multi-attach-fail as soon as
# the fastsam and clip predictors landed on different nodes.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-fastsam
  namespace: intel-vla-training
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: gp3-csi
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-clip
  namespace: intel-vla-training
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: gp3-csi
  resources:
    requests:
      storage: 2Gi
---
# Transient pod that mounts both PVCs so `oc cp` can stage the IR files.
# Deleted once the models are in place, which releases the EBS volumes to
# attach to whichever nodes the predictors schedule onto.
apiVersion: v1
kind: Pod
metadata:
  name: model-loader
  namespace: intel-vla-training
spec:
  containers:
  - name: loader
    image: registry.access.redhat.com/ubi9/ubi-minimal:latest
    command: ["sleep", "infinity"]
    volumeMounts:
    - {name: fastsam, mountPath: /pvc/fastsam}
    - {name: clip,    mountPath: /pvc/clip}
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits:   {cpu: 500m, memory: 512Mi}
  volumes:
  - name: fastsam
    persistentVolumeClaim: {claimName: model-fastsam}
  - name: clip
    persistentVolumeClaim: {claimName: model-clip}
